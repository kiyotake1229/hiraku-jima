<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0f0"/><stop offset="1" stop-color="#3fa8e0"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- 島（アイソメの地面ブロック） -->
  <g transform="translate(256 300)">
    <polygon points="0,-120 170,-30 0,60 -170,-30" fill="#7cc46a"/>
    <polygon points="-170,-30 0,60 0,110 -170,20" fill="#5c9a4c"/>
    <polygon points="170,-30 0,60 0,110 170,20" fill="#4f8441"/>
    <!-- 道 -->
    <polygon points="-70,-66 -30,-86 110,-10 70,10" fill="#5b5f66"/>
    <!-- 木 -->
    <g transform="translate(-100 -40)"><rect x="-5" y="0" width="10" height="20" fill="#7a4f2b"/><polygon points="0,-48 24,8 -24,8" fill="#3f9a4a"/></g>
    <g transform="translate(110 -10)"><rect x="-5" y="0" width="10" height="20" fill="#7a4f2b"/><polygon points="0,-44 22,8 -22,8" fill="#4fae56"/></g>
    <!-- 家 -->
    <g transform="translate(10 -40)">
      <polygon points="-40,-10 0,10 0,60 -40,40" fill="#f1d9b5"/>
      <polygon points="0,10 40,-10 40,40 0,60" fill="#d8bf98"/>
      <polygon points="-40,-10 0,-30 40,-10 0,10" fill="#f6e7c9"/>
      <polygon points="-48,-14 0,-56 48,-14 0,8" fill="#d9534f"/>
      <rect x="10" y="20" width="12" height="12" fill="#ffd27a"/>
    </g>
    <!-- 花 -->
    <circle cx="-60" cy="30" r="7" fill="#ff6fa8"/><circle cx="-40" cy="42" r="6" fill="#ffe14d"/><circle cx="60" cy="40" r="6" fill="#ffffff"/>
  </g>
</svg>
