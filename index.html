<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ひらく島</title>
<style>
:root{
  --bg:#1b2a3a; --panel:rgba(18,28,40,.86); --panel2:rgba(28,42,58,.92);
  --text:#f2f5f8; --sub:#9fb2c4; --accent:#ffc857; --accent2:#5ad1a6; --danger:#ff6b6b;
  --radius:14px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---------- top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 10px 6px;pointer-events:none;z-index:5;}
#res{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding-bottom:2px;}
#res::-webkit-scrollbar{display:none}
.r{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(8px);
  border-radius:999px;padding:5px 10px 5px 7px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25);
  transition:transform .15s;}
.r.bump{transform:scale(1.12);}
.r svg{width:16px;height:16px;flex:0 0 auto}
.r small{font-weight:500;color:var(--sub);font-size:11px;margin-left:1px}
#era{margin-top:6px;display:flex;align-items:center;gap:8px;pointer-events:auto;}
#eraBadge{background:linear-gradient(135deg,#ffc857,#ff9f43);color:#2a1d06;font-weight:800;font-size:12px;
  padding:4px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.3);white-space:nowrap;display:flex;gap:6px;align-items:center}
#eraBadge svg{width:14px;height:14px}
#eraBar{flex:1;height:8px;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;max-width:220px}
#eraFill{height:100%;width:0;background:linear-gradient(90deg,#5ad1a6,#8be0c3);border-radius:999px;transition:width .6s ease}
#eraTxt{font-size:11px;color:var(--sub);white-space:nowrap}

/* ---------- side buttons ---------- */
#side{position:fixed;right:10px;top:calc(var(--safe-t) + 84px);display:flex;flex-direction:column;gap:8px;z-index:5}
.ib{width:42px;height:42px;border-radius:12px;background:var(--panel);backdrop-filter:blur(8px);border:none;color:var(--text);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;transition:transform .12s,background .2s}
.ib:active{transform:scale(.9)}
.ib svg{width:22px;height:22px}
.ib.on{background:var(--accent);color:#2a1d06}

/* ---------- bottom palette ---------- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);backdrop-filter:blur(12px);
  border-radius:18px 18px 0 0;padding:8px 0 calc(var(--safe-b) + 8px);box-shadow:0 -4px 20px rgba(0,0,0,.3);
  transform:translateY(0);transition:transform .25s ease}
#tabs{display:flex;gap:4px;padding:0 10px 8px;}
.tab{flex:1;border:none;background:transparent;color:var(--sub);font-weight:700;font-size:12px;padding:8px 2px;white-space:nowrap;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:background .2s,color .2s}
.tab svg{width:16px;height:16px}
.tab.on{background:rgba(255,255,255,.1);color:var(--text)}
#items{display:flex;gap:8px;overflow-x:auto;padding:2px 10px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
#items::-webkit-scrollbar{display:none}
.it{flex:0 0 auto;width:84px;background:var(--panel2);border:2px solid transparent;border-radius:var(--radius);padding:6px 4px 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .15s,border-color .2s,opacity .2s;scroll-snap-align:start;position:relative}
.it:active{transform:scale(.94)}
.it.on{border-color:var(--accent);background:rgba(255,200,87,.14)}
.it.lock{opacity:.45}
.it img,.it .sw{width:52px;height:52px;border-radius:10px;object-fit:contain;background:rgba(0,0,0,.2)}
.it .sw{display:flex;align-items:center;justify-content:center}
.it .sw svg{width:28px;height:28px}
.it .nm{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
.it .cs{font-size:10px;color:var(--sub);display:flex;gap:3px 5px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:76px;line-height:1.2}
.it .cs span{display:inline-flex;align-items:center;gap:2px}
.it .cs svg{width:10px;height:10px}
.it .cs .ng{color:var(--danger)}
.it .lk{position:absolute;top:4px;right:6px;font-size:9px;background:rgba(0,0,0,.5);padding:2px 5px;border-radius:6px;color:#ffd58a}
#hint{font-size:12px;color:var(--sub);text-align:center;padding:6px 10px 0;min-height:18px}
#hint b{color:var(--accent)}

/* ---------- info popup ---------- */
#info{position:fixed;left:10px;right:10px;bottom:190px;z-index:6;background:var(--panel2);backdrop-filter:blur(10px);
  border-radius:var(--radius);padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;
  animation:up .2s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#info h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
#info p{margin:0 0 8px;font-size:12px;color:var(--sub)}
#info .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(255,255,255,.12);color:var(--text);
  display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.95)}
.btn svg{width:15px;height:15px}
.btn.p{background:var(--accent);color:#2a1d06}
.btn.g{background:var(--accent2);color:#06301f}
.btn.d{background:rgba(255,107,107,.2);color:#ffb3b3}
.btn:disabled{opacity:.4}
#infoClose{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
#infoClose svg{width:16px;height:16px}

/* ---------- toast / float ---------- */
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 120px);transform:translateX(-50%) translateY(-10px);z-index:9;background:rgba(0,0,0,.75);
  color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fl{position:fixed;z-index:8;pointer-events:none;font-weight:800;font-size:15px;color:var(--accent);text-shadow:0 1px 4px rgba(0,0,0,.6);
  animation:fl 1s ease-out forwards}
.fl.w{color:#9ee493}.fl.s{color:#cfd8e3}.fl.n{color:var(--danger)}
@keyframes fl{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}

/* ---------- overlay ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(8,14,22,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
#ov.show{display:flex}
.card{background:#16222f;border-radius:20px;padding:22px 20px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 6px;font-size:22px;display:flex;align-items:center;gap:8px}
.card h2 svg{width:26px;height:26px}
.card p{margin:0 0 12px;font-size:14px;color:var(--sub);line-height:1.6}
.card .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card .row .btn{flex:1;justify-content:center;padding:11px}
.card ul{margin:0 0 10px;padding-left:18px;color:var(--sub);font-size:13px;line-height:1.7}
.card label{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.sw2{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;transition:background .2s;cursor:pointer;border:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw2.on{background:var(--accent2)}
.sw2.on::after{transform:translateX(20px)}
.unl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.unl img{width:46px;height:46px;border-radius:10px;background:rgba(0,0,0,.25)}

#loading{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading h1{margin:0;font-size:26px;letter-spacing:.1em}
#loading .copy{color:var(--accent);font-size:14px;letter-spacing:.08em;margin-top:-6px}
.ib{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.q{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.q .qi{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent)}
.q .qi svg{width:18px;height:18px}
.q .qt{flex:1;min-width:0}
.q .qn{font-size:13px;font-weight:700}
.q .qp{height:6px;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;margin-top:4px}
.q .qp i{display:block;height:100%;background:linear-gradient(90deg,#5ad1a6,#8be0c3);border-radius:999px;transition:width .4s}
.q .qr{font-size:11px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:6px;margin-top:3px}
.q .qr span{display:inline-flex;align-items:center;gap:2px}
.q .qr svg{width:12px;height:12px}
.q.done .qn{color:var(--accent2)}
.q .btn{padding:7px 10px;font-size:12px;flex:0 0 auto}
.ovtabs{display:flex;gap:4px;margin-bottom:6px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px}
.ovtabs .tab{padding:7px;font-size:13px}
.streak{display:flex;gap:4px;margin:8px 0 2px}
.streak span{flex:1;height:28px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.streak span.on{background:var(--accent);color:#2a1d06;font-weight:800}
.card input{width:100%;border:none;border-radius:10px;padding:10px;font-size:15px;background:rgba(255,255,255,.1);color:var(--text);margin:6px 0 10px;outline:none}
.card .list{max-height:50vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--sub);margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.g{background:rgba(90,209,166,.2);color:var(--accent2)}
.card .sub{font-size:12px;color:var(--sub);margin:10px 0 2px;font-weight:700}
.letter{background:linear-gradient(135deg,rgba(255,232,180,.14),rgba(255,200,87,.06));border:1px solid rgba(255,200,87,.3);border-radius:12px;padding:10px 12px;margin:8px 0}
.letter .from{font-size:11px;color:var(--accent);font-weight:700}
.letter .body{font-size:13px;line-height:1.6;margin:3px 0 6px}
.letter .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.stat{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px}
.stat .v{font-size:18px;font-weight:800}
.stat .k{font-size:11px;color:var(--sub)}
.title-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ffc857,#ff9f43);color:#2a1d06;font-weight:800;padding:6px 12px;border-radius:999px;font-size:14px;margin:4px 0 8px}
.card textarea{width:100%;height:90px;border:none;border-radius:10px;padding:8px;font-size:11px;background:rgba(255,255,255,.1);color:var(--text);resize:none;font-family:monospace;outline:none}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;margin:6px 0 4px}
.seg .tab{padding:7px 2px;font-size:12px}
.wc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.wc .sky{width:44px;height:44px;border-radius:12px;flex:0 0 auto;box-shadow:inset 0 -14px 0 rgba(0,0,0,.25)}
.wc .qt{flex:1;min-width:0}
.wc .qn{font-size:14px;font-weight:700}
.wc .qd{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
.wc .btn{flex:0 0 auto;padding:7px 12px;font-size:12px}
#loading small{color:var(--sub)}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top">
  <div id="res">
    <div class="r" id="rCoin"></div>
    <div class="r" id="rWood"></div>
    <div class="r" id="rStone"></div>
    <div class="r" id="rFood"></div>
    <div class="r" id="rPop"></div>
    <div class="r" id="rHappy"></div>
    <div class="r" id="rStar"></div>
  </div>
  <div id="era">
    <div id="eraBadge"></div>
    <div id="eraBar"><div id="eraFill"></div></div>
    <div id="eraTxt"></div>
  </div>
</div>

<div id="side">
  <button class="ib" id="bQuest" title="今日のおねがい・目標"></button>
  <button class="ib" id="bRot" title="回転"></button>
  <button class="ib" id="bHome" title="中心へ"></button>
  <button class="ib" id="bSnd" title="音"></button>
  <button class="ib" id="bWorld" title="世界と季節"></button>
  <button class="ib" id="bPhoto" title="島の写真"></button>
  <button class="ib" id="bSet" title="設定"></button>
</div>

<div id="info">
  <button id="infoClose"></button>
  <h3 id="infoT"></h3>
  <p id="infoD"></p>
  <div class="acts" id="infoA"></div>
</div>

<div id="bottom">
  <div id="tabs"></div>
  <div id="items"></div>
  <div id="hint"></div>
</div>

<div id="toast"></div>
<div id="ov"><div class="card" id="ovCard"></div></div>

<div id="loading"><h1>ひらく島</h1><div class="copy">毎日コツコツ育てる街</div><div class="spin"></div><small>島を用意しています…</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ======================================================================
   ひらく島 — 土地を開拓して村へ、町へ、都市へ。地面を塗って自分の模様の世界を作る。
   単一HTML・オフライン・localStorage 保存。three.js r128 を CDN から読む（iOS版は ios-app/ でローカル同梱）。
   iOS版（Capacitor）では触覚とローカル通知がネイティブになる。Web版では NATIVE が false で従来どおり動く。
   ====================================================================== */

// ---------------------------------------------------------------- icons
const I = {
  coin:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#ffc857"/><circle cx="12" cy="12" r="6" stroke="#b7791f" stroke-width="1.6"/><path d="M12 8v8M10 10h3a1.5 1.5 0 0 1 0 3h-2a1.5 1.5 0 0 0 0 3h3" stroke="#b7791f" stroke-width="1.4" stroke-linecap="round"/></svg>',
  wood:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="8" rx="4" fill="#a86a3a"/><circle cx="7" cy="12" r="2.6" fill="#f0c48c"/><circle cx="7" cy="12" r="1.1" fill="#a86a3a"/></svg>',
  stone:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 16l3-8 5-2 6 4-2 7H7z" fill="#aab4c0"/><path d="M8 8l5-2 2 5-5 3z" fill="#d5dce4"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 21c-4 0-7-3-7-7 0-4 3-6 7-6s7 2 7 6c0 4-3 7-7 7z" fill="#ff8a5c"/><path d="M12 8V5" stroke="#5ad1a6" stroke-width="2" stroke-linecap="round"/><path d="M12 6c2-3 5-2 5-2s-1 3-5 2z" fill="#5ad1a6"/></svg>',
  pop:'<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" fill="#8ecbff"/><circle cx="16" cy="9.5" r="2.6" fill="#8ecbff" opacity=".7"/><path d="M3 19c0-3.5 2.7-6 6-6s6 2.5 6 6z" fill="#8ecbff"/><path d="M14 19c0-2.6 1.5-4.6 3.5-5 1.8.3 3.5 2.2 3.5 5z" fill="#8ecbff" opacity=".7"/></svg>',
  happy:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#ffd166"/><circle cx="9" cy="10" r="1.3" fill="#5a3a00"/><circle cx="15" cy="10" r="1.3" fill="#5a3a00"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3" stroke="#5a3a00" stroke-width="1.6" stroke-linecap="round"/></svg>',
  rot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>',
  snd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
  set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

function genMap(seed, shape){
  shape = shape || 'round';
  const rnd = rngFrom(seed);
  // value noise
  const g = []; const GS = 8;
  for (let i=0;i<(GS+1)*(GS+1);i++) g.push(rnd());
  const noise = (x,y) => {
    const fx = x/N*GS, fy = y/N*GS; const x0=Math.floor(fx), y0=Math.floor(fy);
    const tx = fx-x0, ty=fy-y0; const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
    const v = (a,b)=>g[Math.min(b,GS)*(GS+1)+Math.min(a,GS)];
    return (v(x0,y0)*(1-sx)+v(x0+1,y0)*sx)*(1-sy) + (v(x0,y0+1)*(1-sx)+v(x0+1,y0+1)*sx)*sy;
  };
  const g2 = []; for (let i=0;i<(GS*2+1)*(GS*2+1);i++) g2.push(rnd());
  const noise2 = (x,y) => { const G2=GS*2; const fx=x/N*G2, fy=y/N*G2; const x0=Math.floor(fx),y0=Math.floor(fy); const tx=fx-x0,ty=fy-y0;
    const v=(a,b)=>g2[Math.min(b,G2)*(G2+1)+Math.min(a,G2)]; return (v(x0,y0)*(1-tx)+v(x0+1,y0)*tx)*(1-ty)+(v(x0,y0+1)*(1-tx)+v(x0+1,y0+1)*tx)*ty; };
  tiles.length = 0;
  const c = (N-1)/2;
  for (let z=0; z<N; z++) for (let x=0; x<N; x++){
    const dx=(x-c)/c, dz=(z-c)/c; const dist=Math.sqrt(dx*dx+dz*dz);
    let h = noise(x,z)*0.9 + 0.35 - dist*dist*1.1;
    if (shape==='moon'){ const bx=dx-0.5, bz=dz+0.4; const d2=Math.sqrt(bx*bx+bz*bz); h -= Math.max(0, 0.8-d2*1.5); }
    if (shape==='archi'){ const cs=[[0,0],[0.62,0.2],[-0.55,0.45],[0.15,-0.62],[-0.5,-0.42],[0.55,-0.5]]; let best=-1; for (const [ax,az] of cs){ const d=Math.sqrt((dx-ax)*(dx-ax)+(dz-az)*(dz-az)); best=Math.max(best, 0.4-d*1.5); } h = best + noise(x,z)*0.35 - 0.05; }
    let t;
    if (Math.abs(x-c)<=3.5 && Math.abs(z-c)<=3.5) t='g';
    else if (h < 0.18) t='w';
    else if (h < 0.26) t='s';
    else { const n2=noise2(x,z); t = n2>0.68 ? 'r' : (n2>0.42 ? 'f' : 'g'); }
    const own = Math.abs(x-c)<=2.5 && Math.abs(z-c)<=2.5;
    tiles.push({t, own, b:null, p:null, v:rnd(), l:1});
  }
  // 初期エリアに少し森と岩を置いて、最初の資源にする
  const idx=(x,z)=>z*N+x; const ci=Math.floor(c);
  [[ci-2,ci-2],[ci+2,ci-2],[ci-2,ci+2],[ci+1,ci+2],[ci+2,ci+1]].forEach(([x,z])=>{tiles[idx(x,z)].t='f';});
  tiles[idx(ci+2,ci-1)].t='r'; tiles[idx(ci-1,ci-3)].t='r';
}

  for (let k=0;k<TPT;k++){
    const j=i*TPT+k;

  if (lv>=2){ const c = lv>=3 ? 0xffc857 : 0xcfd8e3; cyl(g,0.015,0.5,0x555,0.42,0,-0.42); bx(g,0.14,0.09,0.01,c,0.49,0.42,-0.42); if (lv>=3) sph(g,0.05,0xffc857,0.42,0.55,-0.42,GLOW); }

}

    if (P[k].fl){ FL_OFF.forEach(([x,z])=>{ const s=new THREE.Mesh(G.sph, mat(P[k].fl)); s.scale.setScalar(0.16); s.position.set(x,0.06,z); gg.add(s); }); }

// ---------------------------------------------------------------- economy
function bigCells(i){ const x=i%N, z=(i/N)|0; if (x>=N-1 || z>=N-1) return null; return [i, i+1, i+N, i+N+1]; }
function neighbors8(i){ const x=i%N, z=(i/N)|0, out=[]; for (let dz=-1;dz<=1;dz++) for (let dx=-1;dx<=1;dx++){ if(!dx&&!dz) continue; const nx=x+dx,nz=z+dz; if(nx>=0&&nz>=0&&nx<N&&nz<N) out.push(nz*N+nx);} return out; }
function neighbors4(i){ const x=i%N, z=(i/N)|0, out=[]; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dz])=>{ const nx=x+dx,nz=z+dz; if(nx>=0&&nz>=0&&nx<N&&nz<N) out.push(nz*N+nx); }); return out; }
function nearRoad(i){ return neighbors4(i).some(j => tiles[j].p && P[tiles[j].p].road); }

let eco = {housing:0, food:6, happy:50, coins:0, wood:0, stone:0, popTarget:0, roadBonus:0, hm:1};
// 隣接ボーナス（情報パネルにも出す）
const nearDeco = i => neighbors8(i).some(j=>tiles[j].b && B[tiles[j].b].cat==='deco');
const nearWaterOrMill = i => neighbors8(i).some(j=>(tiles[j].p&&P[tiles[j].p].water) || tiles[j].b==='windmill');
const nearHomes = i => neighbors8(i).filter(j=>tiles[j].b && B[tiles[j].b].pop).length;
function calcEco(){
  let housing=0, food=6, happy=50, coins=0, wood=0, stone=0, flowerN=0, roadBonus=0;
  for (let i=0;i<N*N;i++){ const tl=tiles[i]; if (!tl.own) continue;
    if (tl.p && P[tl.p].fl) flowerN++;
    if (!tl.b) continue; const b=B[tl.b]; const m=LV_MULT[(tl.l||1)-1]; const eff = v => v<0 ? v : v*m;
    if (b.pop){ let bonus=1; if (nearRoad(i)){ bonus+=0.25; roadBonus++; } if (nearDeco(i)) bonus+=0.1; housing += eff(b.pop)*bonus; }
    if (b.food){ let f=eff(b.food); if ((tl.b==='farm'||tl.b==='bigfarm') && nearWaterOrMill(i)) f*=1.5; food += f; }
    if (b.happy) happy += eff(b.happy);
    if (b.coins){ let c=eff(b.coins); if (tl.b==='market') c += 0.3*nearHomes(i); coins += c; }
    if (b.wood) wood += eff(b.wood) * neighbors8(i).filter(j=>tiles[j].t==='f' && !(tiles[j].p&&P[tiles[j].p].water)).length;
    if (b.stone) stone += eff(b.stone) * neighbors8(i).filter(j=>tiles[j].t==='r').length;
  }
  happy += Math.min(20, flowerN*0.5);
  happy = Math.max(0, Math.min(100, happy));
  housing = Math.floor(housing); food = Math.floor(food);
  const hm = happy<30 ? 0.6 : happy<50 ? 0.85 : 1;   // 幸福が低いと人が住み着かない
  eco = {housing, food, happy, coins, wood, stone, popTarget: Math.floor(Math.min(housing, food)*hm), roadBonus, hm};
}
function upCost(k, lv){ const b=B[k]; const m = lv===1 ? 1.5 : 3; return {c:Math.ceil((b.cost.c||300)*m), w:Math.ceil((b.cost.w||0)*m), s:Math.ceil((b.cost.s||0)*m)}; }
function costText(c){ const a=[]; if (c.c) a.push('コイン'+fmt(c.c)); if (c.w) a.push('木材'+fmt(c.w)); if (c.s) a.push('石'+fmt(c.s)); if (c.st) a.push('星'+c.st); return a.join(' '); }
// 行動のカウント（今日のおねがい・目標に使う）
function count(k, n){ n=n||1; S.cnt[k]=(S.cnt[k]||0)+n; S.life[k]=(S.life[k]||0)+n; checkQuests(); }
function incomePerSec(){ return S.pop*0.15*(0.5+eco.happy/100) + eco.coins; }

const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e4 ? (n/1e3).toFixed(1)+'k' : Math.floor(n).toLocaleString();
let toastT;

function float(x,y,txt,cls){ const d=document.createElement('div'); d.className='fl '+(cls||''); d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }

    try{ const v = Array.isArray(ms) ? Math.max.apply(null, ms) : (ms||10); CAP.Haptics.impact({ style: v>=30 ? 'HEAVY' : v>=15 ? 'MEDIUM' : 'LIGHT' }); }catch(e){}
    return;
  }

// 翌朝9時に「今日のおねがいが届いたよ」を1回だけ通知する（起動のたびに予約し直す）
async function nativeScheduleQuestNotice(){
  if (!(NATIVE && CAP.LocalNotifications)) return;
  try{
    let p = await CAP.LocalNotifications.checkPermissions();
    if (p.display==='prompt' || p.display==='prompt-with-rationale') p = await CAP.LocalNotifications.requestPermissions();
    if (p.display!=='granted') return;
    try{ await CAP.LocalNotifications.cancel({ notifications:[{ id:2001 }] }); }catch(e){}
    const at = new Date(); at.setDate(at.getDate()+1); at.setHours(9,0,0,0);
    await CAP.LocalNotifications.schedule({ notifications:[{ id:2001, title:'ひらく島', body:'今日のおねがいが届いたよ', schedule:{ at, allowWhileIdle:true } }] });
  }catch(e){}
}

function costHtml(cost){ const parts=[]; if (cost.c) parts.push(`<span class="${S.coins<cost.c?'ng':''}">${I.coin}${cost.c}</span>`); if (cost.w) parts.push(`<span class="${S.wood<cost.w?'ng':''}">${I.wood}${cost.w}</span>`); if (cost.s) parts.push(`<span class="${S.stone<cost.s?'ng':''}">${I.stone}${cost.s}</span>`); if (cost.st) parts.push(`<span class="${S.stars<cost.st?'ng':''}">${I.star}${cost.st}</span>`); return parts.join('') || '<span>無料</span>'; }
function canPay(cost){ return S.coins>=(cost.c||0) && S.wood>=(cost.w||0) && S.stone>=(cost.s||0) && S.stars>=(cost.st||0); }
function pay(cost, sign){ const s=sign||-1; S.coins+=s*(cost.c||0); S.wood+=s*(cost.w||0); S.stone+=s*(cost.s||0); S.stars+=s*(cost.st||0); }
function landCost(){ return Math.floor(10 * Math.pow(1.07, S.bought) + S.bought*2); }

function nextHint(){ // いまの状況から「次にやること」を1つ選ぶ
  const homes=cntB(t=>B[t.b].pop), farms=cntB(t=>B[t.b].food);
  if (!homes){ return S.wood<10 ? '森をタップして<b>伐採</b>し、木材を集めよう' : '「住まい」から<b>小さな家</b>を建てよう'; }
  if (!farms && S.pop>=eco.food) return '食料が足りない。「仕事」の<b>畑</b>を建てると人口が増える';
  if (S.pop>=eco.popTarget && eco.popTarget<eco.housing && eco.food<=eco.housing) return '食料が上限。<b>畑</b>や<b>風車</b>で食料を増やそう';
  if (S.pop>=eco.popTarget && eco.housing<=eco.food) return '家がいっぱい。「住まい」を増やそう';
  if (eco.hm<1) return '幸福度が低い。「飾り」を置くと人が増える';
  if (claimableCount()>0) return '右上のリストに<b>ごほうび</b>がある。受け取ろう';

  const nx=ERAS[S.era+1]; if (nx) return `次は<b>${nx.n}</b>（人口${nx.pop}）。家と畑を増やして、道と飾りで底上げ`;
  return '地面を塗って、自分だけの模様を描こう';
}

// ---------------------------------------------------------------- actions
function tileName(tl){ if (tl.b==='__big' && tl.ref!=null) return B[tiles[tl.ref].b].n; if (tl.b) return B[tl.b].n; if (!tl.own) return tl.t==='w'?'海':'未開拓の土地'; if (tl.p&&P[tl.p].water) return '池'; return {g:'草地',w:'水辺',s:'砂地',r:'岩場',f:'森'}[tl.t]; }
function act(i, k, sx, sy){

  if (tl.b==='__big' && tl.ref!=null && ['hand','remove','up','rot'].includes(k)) return act(tl.ref, k, sx, sy);

    showInfo(i); return true; }
  if (k==='buy'){ if (tl.own) return fail('もう自分の土地です'); if (tl.t==='w') return fail('水は「埋め立て」で土地にできます（村から）');
    if (!neighbors4(i).some(j=>tiles[j].own)) return fail('自分の土地に隣り合った場所を選んでね');
    const c=landCost(); if (S.coins<c) return fail(`コインが足りない（${c}必要）`);
    S.coins-=c; S.bought++; tl.own=true; float(sx,sy,'-'+c,'n'); sfx('land'); haptic(15); refreshTile(i); flushInstances(); renderItems(); setHint(); tutorial(1); count('buy'); return true; }
  if (k==='fill'){ if (S.era<2) return fail('村になると埋め立てできます'); if (!isWater) return fail('水を選んでね');
    if (!tl.own && !neighbors4(i).some(j=>tiles[j].own)) return fail('自分の土地に接した水を選んでね');
    if (S.stone<40) return fail('石が足りない（40必要）'); S.stone-=40; tl.t='s'; tl.p=null; tl.own=true; float(sx,sy,'-40 石','n'); sfx('land'); haptic(15); puff(i,0x9fd6ff); refreshTile(i); flushInstances(); count('fill'); return true; }
  if (!tl.own) return fail('まず「開拓」で土地を買おう');
  if (k==='clear'){ if (tl.t!=='f'||isWater) return fail('森を選んでね'); const w=4+Math.round(tl.v*3); S.wood+=w; tl.t='g'; float(sx,sy,'+'+w+' 木材','w'); bump('rWood'); sfx('chop'); haptic(12); puff(i,0x6aa84f); refreshTile(i); flushInstances(); tutorial(2); count('clear'); return true; }
  if (k==='mine'){ if (tl.t!=='r') return fail('岩を選んでね'); const s=3+Math.round(tl.v*3); S.stone+=s; tl.t='g'; float(sx,sy,'+'+s+' 石','s'); bump('rStone'); sfx('rock'); haptic(12); puff(i,0xb4bcc6); refreshTile(i); flushInstances(); count('mine'); return true; }
  if (k==='plant'){ if (tl.b) return fail('建物があります'); if (isWater) return fail('水には植えられません'); if (tl.t==='f') return fail('もう森です'); if (S.coins<5) return fail('コインが足りない'); S.coins-=5; tl.t='f'; if (tl.p && P[tl.p].fl) tl.p=null; sfx('place'); haptic(); pop(i); refreshTile(i); flushInstances(); count('plant'); return true; }
  if (k==='remove'){ if (!tl.b) return fail('建物がありません'); const b=B[tl.b]; const back={c:Math.floor((b.cost.c||0)/2),w:Math.floor((b.cost.w||0)/2),s:Math.floor((b.cost.s||0)/2),st:Math.floor((b.cost.st||0)/2)}; pay(back,+1); if (b.big){ bigCells(i).forEach(j=>{ if (j!==i && tiles[j].b==='__big'){ tiles[j].b=null; tiles[j].ref=undefined; refreshTile(j); } }); } tl.b=null; tl.l=1; tl.r=0; sfx('remove'); haptic(20); puff(i,0xdddddd); refreshTile(i); flushInstances(); calcEco(); renderRes(); return true; }
  if (k==='__erase'){ if (!tl.p) return fail('塗られていません'); if (P[tl.p].water && tl.b) return fail('建物があります'); tl.p=null; sfx('tick'); refreshTile(i); flushInstances(); return true; }
  if (k.startsWith('p:')){ const pk=k.slice(2); const pd=P[pk];
    if (tl.t==='w') return fail('海は塗れません。埋め立ててから');
    if (pd.water){ if (S.era<1) return fail('集落になると池を作れます'); if (tl.b) return fail('建物があります'); if (tl.t==='f'||tl.t==='r') return fail('先に伐採・採掘してね'); if (S.stone<10) return fail('石が足りない（10必要）'); S.stone-=10; }
    if (tl.p===pk) return true;
    tl.p = pk; if (pd.fl && tl.t==='f') tl.t='g'; sfx('tick'); refreshTile(i); flushInstances(); calcEco(); count('paint'); if (pd.fl) count('flowerpaint'); if (pd.water) count('pond'); if (pk==='snow') count('snowpaint'); return true; }
  if (k==='up'){ if (!tl.b) return fail('建物を選んでね'); const lv=tl.l||1; if (lv>=3) return fail('もう最高レベル（Lv3）です'); const c=upCost(tl.b,lv); if (!canPay(c)) return fail('材料が足りない（'+costText(c)+'）');
    pay(c); tl.l=lv+1; sfx('land'); haptic(15); float(sx,sy,'Lv'+(lv+1)+'！'); refreshTile(i); flushInstances(); pop(i); calcEco(); renderRes(); count('up'); return true; }
  // 建物
  const b = B[k]; if (!b) return false;
  if (b.era>S.era) return fail(`${ERAS[b.era].n}になると建てられます`);
  if (b.season!=null && b.season!==seasonIdx()) return fail(`${SEASONS[b.season].n}にだけ建てられます`);
  if (b.world && !S.worlds.includes(b.world)) return fail(`${WORLDS[b.world].n}の世界をひらくと建てられます`);
  if (tl.b) return fail('もう建物があります（撤去してから）');
  if (b.big){ const cells=bigCells(i); if (!cells) return fail('端すぎて置けません（2×2マス必要）');
    for (const j of cells){ const c=tiles[j]; const cw=c.t==='w'||(c.p&&P[c.p].water); if (!c.own) return fail('2×2マスぜんぶ自分の土地が必要'); if (c.b) return fail('2×2マスに建物があります'); if (cw) return fail('2×2マスに水があります'); if (c.t==='f'||c.t==='r') return fail('2×2マスの森・岩を先に片付けよう'); } }
  if (isWater) return fail('水の上には建てられません');
  if (tl.t==='f') return fail('先に「伐採」で森を切ろう');
  if (tl.t==='r') return fail('先に「採掘」で岩を砕こう');
  if (!canPay(b.cost)) return fail('材料が足りない');
  pay(b.cost); tl.b=k; tl.l=1; tl.r=0; if (b.big){ bigCells(i).forEach(j=>{ if (j!==i){ tiles[j].b='__big'; tiles[j].ref=i; refreshTile(j); } }); } sfx('place'); haptic(12); pop(i); refreshTile(i); flushInstances(); calcEco(); renderRes(); renderItems();
  if (k==='hut') tutorial(3); if (k==='farm') tutorial(4);
  count('build'); if (b.cat==='deco') count('deco'); if (b.food) count('farmbuild');
  return true;
}

const walkers = []; const WCOL = [0xff6b6b,0x5ad1a6,0x8ecbff,0xffc857,0xb79be6,0xff8a5c];
function makeWalker(){ const g=new THREE.Group(); const c=WCOL[(Math.random()*WCOL.length)|0]; const b=cyl(g,0.07,0.17,c,0,0,0); b.castShadow=false; const h=sph(g,0.075,0xf6d9b5,0,0.25,0); h.castShadow=false; const hair=sph(g,0.078,[0x3a2a1a,0x6b4321,0xd9a066,0x222][(Math.random()*4)|0],0,0.27,0); hair.scale.y=0.6; hair.castShadow=false; g.userData={i:-1,from:-1,t:1,speed:1}; return g; }
function walkable(j){ const t=tiles[j]; return t.own && !t.b && t.t!=='w' && t.t!=='f' && t.t!=='r' && !(t.p&&P[t.p].water); }
function updateWalkers(dt){
  const want = Math.min(16, Math.floor(S.pop/4));
  if (walkers.length<want){ const cands=[]; for (let i=0;i<N*N;i++) if (walkable(i)) cands.push(i); if (cands.length){ const g=makeWalker(); const i=cands[(Math.random()*cands.length)|0]; g.userData.i=i; g.userData.from=i; g.position.set(i%N,0.5,(i/N)|0); world.add(g); walkers.push(g); } }
  while (walkers.length>want) world.remove(walkers.pop());
  for (let w=walkers.length-1; w>=0; w--){ const g=walkers[w]; const u=g.userData;
    if (u.t>=1){
      const ns=neighbors4(u.i).filter(walkable);
      if (!ns.length){ world.remove(g); walkers.splice(w,1); continue; }
      const roads=ns.filter(j=>tiles[j].p&&P[tiles[j].p].road); const pick=(roads.length && Math.random()<0.85) ? roads : ns; const j=pick[(Math.random()*pick.length)|0];
      u.from=u.i; u.i=j; u.t=0; u.speed=0.5+Math.random()*0.4; g.rotation.y=Math.atan2((j%N)-(u.from%N), ((j/N)|0)-((u.from/N)|0));
    }
    u.t+=dt*u.speed; const a=Math.min(1,u.t); const fx=u.from%N, fz=(u.from/N)|0, tx=u.i%N, tz=(u.i/N)|0;
    g.position.set(fx+(tx-fx)*a, 0.5+Math.abs(Math.sin(u.t*Math.PI*3))*0.03, fz+(tz-fz)*a);
  }
}

function tone(f, t, dur, type, vol){ const o=sfxCtx.createOscillator(), g=sfxCtx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(sfxCtx.destination); o.start(t); o.stop(t+dur+0.02); return o; }
function sfx(k){
  if (!audioOn || !sfxCtx) return; const t=sfxCtx.currentTime;
  switch(k){
    case 'tick': tone(880,t,0.05,'square',0.04); break;
    case 'place': tone(440,t,0.08,'triangle',0.1); tone(660,t+0.07,0.12,'triangle',0.1); break;
    case 'coin': tone(1200,t,0.06,'square',0.06); tone(1600,t+0.06,0.1,'square',0.06); break;
    case 'chop': tone(200,t,0.08,'sawtooth',0.08); tone(150,t+0.05,0.1,'square',0.05); break;
    case 'rock': tone(120,t,0.12,'square',0.08); tone(90,t+0.06,0.12,'sawtooth',0.06); break;
    case 'land': tone(330,t,0.1,'triangle',0.1); tone(440,t+0.1,0.1,'triangle',0.1); tone(550,t+0.2,0.16,'triangle',0.1); break;
    case 'remove': { const o=tone(300,t,0.2,'sawtooth',0.07); o.frequency.exponentialRampToValueAtTime(80,t+0.2); } break;
    case 'no': tone(180,t,0.12,'square',0.06); break;

// ---------------------------------------------------------------- game loop
let last=performance.now(), acc=0, popAcc=0, dayT=0, dayAcc=0; const perf={on:true, n:0, t:0};
const _sky = new THREE.Color();
function tick(dt){
  // 収入
  S.coins += incomePerSec()*dt; S.wood += eco.wood*dt; S.stone += eco.stone*dt;
  // 人口はゆっくり目標へ
  popAcc += dt; if (popAcc>1.2){ popAcc=0; if (S.pop<eco.popTarget) S.pop++; else if (S.pop>eco.popTarget) S.pop--; if (S.pop>(S.maxPop||0)) S.maxPop=S.pop; checkLetter(); if (!tool.k || tool.k==='hand') setHint(); }
  // 時代
  let ne=S.era; while (ERAS[ne+1] && S.pop>=ERAS[ne+1].pop) ne++;
  if (ne>S.era) eraUp(ne);
  // 日付が変わったら新しい一日
  dayAcc += dt; if (dayAcc>5){ dayAcc=0; if (todayStr()!==S.day){ newDay(); applyTheme(); renderItems(); lastBadge=-1; renderBadge(); if (!$('ov').classList.contains('show')) showQuests('today', '<p>日付が変わった！新しいおねがいが届きました。</p>'); } }
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now-last)/1000); last=now;
  if (S){ acc+=dt; if (acc>0.25){ tick(acc); acc=0; renderRes(); } }
  // 重い端末では影を自動でOFF（最初の8秒の平均が低いとき。設定で手動にしていれば触らない）
  if (perf.on){ perf.n++; perf.t+=dt; if (perf.t>8){ perf.on=false; const fps=perf.n/perf.t; if (fps<28 && shadowsOn && LS.get('hiraku.shadow')===null){ shadowsOn=false; renderer.shadowMap.enabled=false; sun.castShadow=false; Object.values(matCache).forEach(m=>m.needsUpdate=true); toast('動きを軽くするため影をOFFにしました（設定で戻せます）'); } } }
  // 昼夜（4分で1周）
  dayT = (now/1000/240)%1; const dl = 0.5-0.5*Math.cos(dayT*Math.PI*2); // 0夜 1昼
  const night = Math.max(0, 1 - dl*2.2);
  if (dl>0.5) _sky.copy(T.eveC).lerp(T.dayC, (dl-0.5)*2); else _sky.copy(T.nightC).lerp(T.eveC, dl*2);
  scene.background.copy(_sky); scene.fog.color.copy(_sky);
  sun.intensity = (0.25+dl*0.85)*(T.sunMax||1); hemi.intensity = 0.35+dl*0.45; sun.color.setHSL(0.09, 0.5, 0.75+dl*0.2);
  WIN.emissiveIntensity = Math.max(T.winBase||0, night*0.9); GLOW.emissiveIntensity = Math.max((T.winBase||0)*1.2, night*1.2);
  // カメラ回転
  if (rotTarget!==null){ const d=rotTarget-cam.ang; if (Math.abs(d)<0.002){ cam.ang=rotTarget; rotTarget=null; } else cam.ang+=d*Math.min(1,dt*8); updateCamera(); }
  // アニメ
  const t=now/1000; for (const a of anims) a.fn(t);
  for (let i=0;i<buildMeshes.length;i++){ const g=buildMeshes[i]; if (!g) continue;
    if (g.userData.popT!==undefined){ g.userData.popT+=dt*4; const u=Math.min(1,g.userData.popT); const s=1+Math.sin(u*Math.PI)*0.25; g.scale.set(u*s, u*s, u*s); if (u>=1){ g.scale.set(1,1,1); delete g.userData.popT; } }
    if (g.userData.k==='fireworks' && night>0.5){ g.userData.fw=(g.userData.fw||0)+dt; if (g.userData.fw>1.8){ g.userData.fw=Math.random()*0.6; burst(g.position.x, 3.2+Math.random()*1.5, g.position.z); } }
    if (g.userData.bounce){ g.userData.bounce-=dt*3; const b=Math.max(0,g.userData.bounce); g.scale.set(1+b*0.12,1-b*0.15+Math.sin(b*Math.PI)*0.2,1+b*0.12); if (b<=0){ g.scale.set(1,1,1); g.userData.bounce=0; } } }
  for (let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.userData.life-=dt*(p.userData.decay||1.6); p.userData.v.y-=(p.userData.g!==undefined?p.userData.g:9)*dt; p.position.addScaledVector(p.userData.v, dt); p.rotation.x+=dt*5; p.rotation.z+=dt*3; p.scale.setScalar(Math.max(0.01,p.userData.life)*(p.userData.base||1)); if (p.userData.life<=0){ world.remove(p); particles.splice(i,1); } }
  selMesh.material.opacity = 0.45+0.25*Math.sin(t*6);
  if (S){ updateWalkers(dt); ambUpdate(dt, t, night); roamUpdate(dt, t); }
  renderer.render(scene, camera);
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); updateCamera(); }
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- boot
function boot(){
  audioOn = LS.get('hiraku.snd')!=='0'; shadowsOn = LS.get('hiraku.shadow')!=='0';
  renderer.shadowMap.enabled = shadowsOn; sun.castShadow = shadowsOn; renderSnd();
  makeThumbs();
  const loaded = load();
  if (!loaded){ S = newState(); genMap(S.seed, 'round'); }
  if (!S.worlds || !S.worlds.length) S.worlds=['island']; if (!WORLDS[S.world]) S.world='island';
  calcEco(); applyTheme(); resize(); renderTabs(); renderItems(); setHint(); renderRes();
  // おかえりボーナス（最大6時間、半分の効率）
  let gains='';
  if (loaded){ const sec = Math.min(6*3600, (Date.now()-S.time)/1000); if (sec>60){ const c=Math.floor(incomePerSec()*sec*0.5), w=Math.floor(eco.wood*sec*0.5), st=Math.floor(eco.stone*sec*0.5); S.coins+=c; S.wood+=w; S.stone+=st;
    const m = Math.floor(sec/60); gains = `<p><b>おかえり！</b> 留守の${m>=60?Math.floor(m/60)+'時間':m+'分'}のあいだに島が育ちました: コイン +${fmt(c)}${w?` / 木材 +${fmt(w)}`:''}${st?` / 石 +${fmt(st)}`:''}</p>`; } }
  const nd = newDay(); if (!S.letter) S.letter=pickLetter(); lastBadge=-1; renderBadge();
  if (!loaded) setTimeout(showShapeSelect, 300);
  else if (nd || gains) showQuests('today', gains);
  nativeScheduleQuestNotice();
  requestAnimationFrame(frame);
  setTimeout(()=>$('loading').classList.add('hide'), 200);
}
window.__hiraku = { get S(){ return S; }, tiles, eco:()=>eco, act, calcEco, renderRes, tileAt, cam, updateCamera, applyTheme };
try { boot(); } catch(e){ document.getElementById('loading').innerHTML = '<h1>エラー</h1><small>'+e.message+'</small>'; console.error(e); }
})();
</script>
